<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Dream, now a Blog</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#F2E9DC;--gold:#E0B96B}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:pointer;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;
 background:linear-gradient(90deg,#0a121e 0,#182a40 50%,#4d2c15 50.01%,#241610 100%);overflow:hidden}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 85% 90%,rgba(255,157,66,.4),transparent 65%)}
#line{position:absolute;left:958px;top:60px;width:3px;height:960px;background:linear-gradient(transparent,#F0D9A8 15%,#F0D9A8 85%,transparent);opacity:.85}
.col{position:absolute;top:80px;height:920px;width:740px;display:flex;flex-direction:column;justify-content:center;gap:34px;
 font-family:Lora,Georgia,serif;font-weight:500;font-size:42px;line-height:1.45;color:var(--ink)}
#L{left:120px}#R{left:1060px}
.col p{margin:0;opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s ease}
.col p.on{opacity:1;transform:none}
.col p.g{color:var(--gold);font-style:italic}
#hint{position:absolute;bottom:22px;width:100%;text-align:center;font:22px Georgia,serif;color:#F2E9DC;opacity:.35;transition:opacity 1s}
</style>
</head>
<body>
<div id="stage"><div id="line"></div><div class="col" id="L"></div><div class="col" id="R"></div>
<div id="hint">Click, Space or → to reveal · ← to go back · F for fullscreen</div></div>
<script>
const S=[
[["*A Dream, now a Blog"],["by Divyansh Dubey","10th September 2026"]],
[["Last night, I had a dream that refused to leave me."],["I saw a war.","There were many people fighting, running, struggling, everyone seemed to be carrying the weight of something much bigger than themselves."]],
[["And among them was a small boy, perhaps ten or twelve years old.","He was just a child.","Yet somehow, he was there, fighting alongside everyone else."],["When the conflict finally drew to a close, people murmured as they passed him: “He’s just a kid. What could he possibly have done?”","They saw him, but they didn’t really look."]],
[["When I looked closer, I noticed his right foot was badly injured.","He moved forward without letting any pain show on his face, but watching him, I could feel every jagged step."],["I wanted to reach out, to ask if he was okay, to tell him that the battle was done and there is no need of pretending to be strong anymore."]],
[["Before I could take a step, he turned toward the path leading home. He didn’t glance left or right.","Head bowed, eyes locked onto the dirt, he forced every stride to look steady and deliberate."],["I stayed silent. I didn’t want to break the armor he had so carefully put on. Instead, I quietly followed behind.","He didn’t notice me."]],
[["He simply kept walking towards his home trying to walk normally in every step.","There was something about the way he carried himself that made me feel that every step was harder than he wanted anyone to know."],["Up ahead, his parents were waiting outside their home.","The moment his mother caught sight of him, she broke into a run."]],
[["No questions. No hesitation. No waiting for an explanation of where he had been."],["She simply pulled him into her arms, kissed his face, and held him close as if the only truth that mattered in that moment was that her boy had returned."]],
[["Then she noticed his injured foot.","Her face changed.","Her heart was filled with tears."],["She looked at him with the kind of pain only a mother could feel when she realizes that her child had been suffering without her ever knowing.","She immediately took him inside for help."]],
[["I stood there watching them.","And for some reason, I felt overwhelmed.","Not because of the war.","Not because of the injury."],["But because of the love between a mother and her child.","There was something incredibly beautiful about the way she ran towards him as if no matter how long the war had lasted, no matter what had happened, he was still her little boy."]],
[["Perhaps it was the way she held him.","Perhaps it was the relief in his father’s eyes.","Or perhaps it was simply the sight of someone being expected somewhere."],["I looked around. Almost every other person had a home waiting for them.","Some were being held tightly. Some were being questioned, others softly scolded for causing worry, and many simply guided inside by warm hands."]],
[["Everyone seemed to belong somewhere.","Everyone seemed to have someone looking for them."],["One by one, the street emptied as everyone disappeared into a doorway that belonged to them."]],
[["I don’t know how long I stood there watching.","I turned and looked back down the dark, empty road behind me."],["There was no one walking towards me.","No one looking for me.","No one waiting to see if I had returned."]],
[["And suddenly, the quiet truth landed: I had fought in that very same war. I had crossed that exact same battlefield. I had carried fear, and I had bled just as much."],["The only difference was that when it all ended, I had nowhere to return to.","*And somehow, that cut deeper than any wound from the battle itself."]],
[["I looked back towards the little boy.","He was already inside. His mother was taking care of his injured foot.","He had someone to return to."],["*And I was still standing outside in the cold, invisible."]],
[["There was no one to ask “Are you okay?”","No one to notice that perhaps my wounds weren’t on my body only."],["And that was the part of the dream that stayed with me.","I wasn’t thinking about the boy anymore. I was thinking about the person standing there, watching everyone else being loved."]],
[["And I couldn’t stop asking myself–"],["*Why do we assume that someone who walks without limping isn’t hurting?"]],
[["Maybe the hardest part of surviving quietly is that people begin to believe you never needed help in the first place."],["Maybe some people become so good at hiding their pain that nobody thinks to ask about it."]],
[["Perhaps somewhere in all of us, there is a little boy who has fought his own battles quietly, who kept walking even when his feet hurt, who kept smiling even when he wanted someone to hold him,"],["who came back from his own war… only to realize that no one was waiting for him."]],
[["I keep thinking about that boy.","Not the one who was welcomed home and comforted, but the one who stood by the curb, watching everyone else be loved."],["Maybe it was because I knew what it felt like to keep walking while pretending nothing hurt."]],
[["Maybe that’s why I couldn’t take my eyes off him.","Maybe that’s why I followed his footsteps so closely."],["Or maybe…","*the person I was following in the dark was someone I have known for a very long time."]]
];
const L=document.getElementById('L'),R=document.getElementById('R'),stage=document.getElementById('stage'),hint=document.getElementById('hint');
let s=0,k=1;
function build(){
  [L,R].forEach((c,i)=>{c.innerHTML="";S[s][i].forEach(t=>{const p=document.createElement('p');
    if(t[0]=='*'){p.className='g';t=t.slice(1)}p.textContent=t;c.appendChild(p)})});
  apply();
}
function apply(){
  const ps=[...L.children,...R.children];
  ps.forEach((p,i)=>p.classList.toggle('on',i<k));
}
function total(){return S[s][0].length+S[s][1].length}
function next(){
  hint.style.opacity=0;
  if(k<total()){k++;apply()}
  else if(s<S.length-1){s++;k=1;build()}
}
function prev(){
  if(k>1){k--;apply()}
  else if(s>0){s--;k=total();build()}
}
function fit(){
  const sc=Math.min(innerWidth/1920,innerHeight/1080);
  stage.style.transform=`scale(${sc}) translate(-50%,-50%)`;
  stage.style.transformOrigin='0 0';
  stage.style.left='50%';stage.style.top='50%';
  stage.style.marginLeft=0;
}
function place(){
  const sc=Math.min(innerWidth/1920,innerHeight/1080);
  stage.style.transform=`translate(${-960*sc}px,${-540*sc}px) scale(${sc})`;
}
addEventListener('resize',place);
addEventListener('click',next);
addEventListener('keydown',e=>{
  if([' ','ArrowRight','ArrowDown','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key=='f'||e.key=='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
place();build();
</script>
</body>
</html>
